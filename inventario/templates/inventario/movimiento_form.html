{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Movimiento - Noir{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <h3 class="mb-4 text-bone text-center">Registrar Movimiento</h3>
        <div class="card card-gothic p-4">
            <div class="card-body">
                <p class="text-muted-gothic small mb-4" style="border-left: 2px solid var(--accent-gold); padding-left: 10px;">
                    El stock se actualizará automáticamente tras confirmar el registro.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-5 d-flex justify-content-end gap-3">
                        <a href="{% url 'inventario:dashboard' %}" class="btn btn-gothic-outline px-4">CANCELAR</a>
                        <button type="submit" class="btn btn-gothic-primary px-4">CONFIRMAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
